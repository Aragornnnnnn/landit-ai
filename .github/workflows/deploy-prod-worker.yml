name: Deploy prod worker

on:
  workflow_dispatch:
    inputs:
      version:
        description: '배포 버전. 예시 1.2.0'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: prod-worker-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  AWS_ROLE_ARN: ${{ vars.PROD_AWS_ROLE_ARN || secrets.PROD_AWS_ROLE_ARN }}
  ECR_REPOSITORY: ${{ vars.PROD_WORKER_ECR_REPOSITORY }}
  ECR_IMAGE_URI: ${{ vars.PROD_WORKER_ECR_IMAGE_URI }}
  ECS_CLUSTER: ${{ vars.PROD_WORKER_ECS_CLUSTER }}
  ECS_SERVICE: ${{ vars.PROD_WORKER_ECS_SERVICE }}
  CONTAINER_NAME: worker
  HEALTH_CHECK_URL: ${{ vars.PROD_WORKER_HEALTH_CHECK_URL || 'https://ai.landit.im/health' }}

jobs:
  deploy:
    name: Build and deploy prod worker
    runs-on: ubuntu-latest
    env:
      RELEASE_RECORD: deployment-record.json

    steps:
      - name: Validate main branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Production deploy must run from main branch"
            exit 1
          fi

      - name: Validate deployment settings
        run: |
          test -n "$AWS_ROLE_ARN"
          test -n "$ECR_REPOSITORY"
          test -n "$ECR_IMAGE_URI"
          test -n "$ECS_CLUSTER"
          test -n "$ECS_SERVICE"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use MAJOR.MINOR.PATCH format"
            exit 1
          fi

          release_tag="ai-v$RELEASE_VERSION"
          if git rev-parse -q --verify "refs/tags/$release_tag" >/dev/null; then
            echo "$release_tag already exists"
            exit 1
          fi

          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            --build-arg "APP_VERSION=${GITHUB_SHA}" \
            -t "$ECR_IMAGE_URI:${GITHUB_SHA}" \
            .

      - name: Push Docker image
        run: |
          docker push "$ECR_IMAGE_URI:${GITHUB_SHA}"

      - name: Deploy pinned ECS task revision
        id: deploy
        run: python3 .github/scripts/deploy-ecs-revision.py

      - name: Verify ECS service
        timeout-minutes: 12
        env:
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
          DEPLOYMENT_CREATED_AT: ${{ steps.deploy.outputs.deployment_created_at }}
          TASK_DEFINITION: ${{ steps.deploy.outputs.task_definition }}
          IMAGE_DIGEST: ${{ steps.deploy.outputs.image_digest }}
        run: bash .github/scripts/verify-ecs-deployment.sh

      - name: Preserve deployment and rollback versions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-record-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RELEASE_RECORD }}
          retention-days: 90
          if-no-files-found: warn

      - name: Publish Git tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "$RELEASE_TAG 프로덕션 배포"
          git push origin "$RELEASE_TAG"
          gh release create "$RELEASE_TAG" "$RELEASE_RECORD" \
            --verify-tag \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes
